name: Vivid release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivid-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'blurbery/vivid' && github.ref == 'refs/heads/main' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned release tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check version rules and release notes
        run: npm run test:release
      - name: Check Discord release notification
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: node scripts/release/discord-notify.mjs --check-webhook
      - name: Publish version and update bullets
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: blurbery
          GIT_AUTHOR_EMAIL: ${{ vars.VIVID_GIT_NOREPLY_EMAIL }}
          GIT_COMMITTER_NAME: blurbery
          GIT_COMMITTER_EMAIL: ${{ vars.VIVID_GIT_NOREPLY_EMAIL }}
        run: |
          BEFORE_RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .id 2>/dev/null || true)"
          case "$GIT_AUTHOR_EMAIL" in
            *@users.noreply.github.com) ;;
            *) echo "Configure VIVID_GIT_NOREPLY_EMAIL before releasing."; exit 1 ;;
          esac
          npm run release
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "$RUNNER_TEMP/vivid-release.json"
          AFTER_RELEASE_ID="$(jq -r .id "$RUNNER_TEMP/vivid-release.json")"
          if [ -n "$AFTER_RELEASE_ID" ] && [ "$AFTER_RELEASE_ID" != "$BEFORE_RELEASE_ID" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Post release notes to Discord
        if: steps.publish.outputs.published == 'true'
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: node scripts/release/discord-notify.mjs "$RUNNER_TEMP/vivid-release.json"
