name: Vivid release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivid-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'blurbery/vivid' && github.ref == 'refs/heads/main' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned release tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check version rules and release notes
        run: npm run test:release
      - name: Publish version and update bullets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: blurbery
          GIT_AUTHOR_EMAIL: ${{ vars.VIVID_GIT_NOREPLY_EMAIL }}
          GIT_COMMITTER_NAME: blurbery
          GIT_COMMITTER_EMAIL: ${{ vars.VIVID_GIT_NOREPLY_EMAIL }}
        run: |
          case "$GIT_AUTHOR_EMAIL" in
            *@users.noreply.github.com) ;;
            *) echo "Configure VIVID_GIT_NOREPLY_EMAIL before releasing."; exit 1 ;;
          esac
          npm run release
