name: Claude Code Review

# Reviews pull requests through the Claude API (scripts/ci/claude-review.py)
# and posts inline comments plus one summary comment. The first run reviews the
# whole PR. Each later push is reviewed from the last reviewed commit, so only
# new changes are read and earlier fixes are checked; after a force-push or
# rebase the whole PR is reviewed again. The summary comment (marked
# <!-- claude-review sha=... -->) records the reviewed commit and is updated in
# place. Each run stops at a cost limit and keeps what it found so far. Skips
# drafts, bots, fork PRs (GitHub withholds secrets from them) and
# Markdown-only changes. Needs the ANTHROPIC_API_KEY secret (reviews come out
# of API credits), plus ANTHROPIC_WORKSPACE_ID for a key that covers several
# workspaces. Without a key, the job does nothing.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "**/*.md"

# A newer push waits for the running review rather than cancelling it, so the
# credit already spent isn't wasted. Reviews still queued are replaced.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CREDENTIALS: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      REVIEW_MODEL: claude-sonnet-5-5
      REVIEW_EFFORT: low
    steps:
      - name: Skip without credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Add an ANTHROPIC_API_KEY repository secret to turn on Claude reviews."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prepare the review
        id: prep
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          dir=.claude-review
          mkdir -p "$dir"

          # The latest summary comment and the commit it reviewed ("-" for the
          # older marker, which didn't record one).
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review"))) | "\(.id) \((.body | capture("sha=(?<s>[0-9a-f]{40})") | .s) // "-")"' \
            > "$RUNNER_TEMP/summaries.txt"
          comment_id=""
          last_sha=""
          if [ -s "$RUNNER_TEMP/summaries.txt" ]; then
            read -r comment_id last_sha < <(tail -n 1 "$RUNNER_TEMP/summaries.txt")
            if [ "$last_sha" = "-" ]; then last_sha=""; fi
          fi
          if [ "$last_sha" = "$HEAD_SHA" ]; then
            echo "::notice::This commit has already been reviewed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only "$merge_base" "$HEAD_SHA" > "$dir/files.txt"
          if [ -n "$last_sha" ] && git merge-base --is-ancestor "$last_sha" "$HEAD_SHA" 2>/dev/null; then
            mode=incremental
            from=$last_sha
          else
            mode=full
            from=$merge_base
          fi

          # Only the PR's own files, without generated Xcode project files, so
          # a merge from main doesn't pull unrelated changes into the review.
          mapfile -t files < <(grep -vE '\.xcodeproj/|\.xcworkspace/' "$dir/files.txt" || true)
          : > "$dir/diff.patch"
          if [ "${#files[@]}" -gt 0 ]; then
            git diff "$from" "$HEAD_SHA" -- "${files[@]}" > "$dir/diff.patch"
          fi
          if [ ! -s "$dir/diff.patch" ]; then
            echo "::notice::Nothing new to review since ${from:0:7}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr view "$PR" --repo "$REPO" --json title,body --jq '"# \(.title)\n\n\(.body)"' > "$dir/pr.md"
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | "- \(.user.login) on \(.path):\(.line // .original_line) (comment \(.id)\(if .in_reply_to_id then ", replying to \(.in_reply_to_id)" else "" end)): \(.body | gsub("<!--[^>]*-->"; "") | split("<details>")[0] | gsub("\\s+"; " ") | .[0:800])"' \
            > "$dir/comments.md"
          if [ ! -s "$dir/comments.md" ]; then echo "No review comments yet." > "$dir/comments.md"; fi

          {
            echo "mode=$mode"
            echo "from=$from"
            echo "merge_base=$merge_base"
            echo "comment_id=$comment_id"
          } >> "$GITHUB_OUTPUT"
      - name: Review with Claude
        id: claude
        if: env.HAS_CREDENTIALS == 'true' && steps.prep.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          # Cost limits per run in US$: a whole PR, or only the new commits.
          REVIEW_MAX_COST_USD: ${{ steps.prep.outputs.mode == 'incremental' && '0.75' || '1.50' }}
        run: |
          if [ -n "$ANTHROPIC_WORKSPACE_ID" ]; then echo "::add-mask::$ANTHROPIC_WORKSPACE_ID"; fi
          pip install --quiet --disable-pip-version-check "anthropic==1.11.0"
          python3 scripts/ci/claude-review.py \
            --pr "${{ github.event.pull_request.number }}" \
            --mode "${{ steps.prep.outputs.mode }}" \
            --from "${{ steps.prep.outputs.from }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --merge-base "${{ steps.prep.outputs.merge_base }}" \
            --out "$RUNNER_TEMP/review.json"
      - name: Post the review
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODE: ${{ steps.prep.outputs.mode }}
          FROM: ${{ steps.prep.outputs.from }}
          COMMENT_ID: ${{ steps.prep.outputs.comment_id }}
        run: |
          set -euo pipefail
          review="$RUNNER_TEMP/review.json"
          payload="$RUNNER_TEMP/payload.json"
          if [ "$MODE" = incremental ]; then
            scope="new commits ${FROM:0:7}..${HEAD_SHA:0:7}"
          else
            scope="whole PR at ${HEAD_SHA:0:7}"
          fi

          # Findings on changed lines go in one review with inline comments.
          # GitHub rejects the whole review if any line isn't in the diff, so
          # the script only marks lines it found in the diff as inline.
          jq --arg sha "$HEAD_SHA" --arg scope "$scope" '{
              commit_id: $sha,
              event: "COMMENT",
              body: "Claude review of the \($scope). The summary comment lists everything found.",
              comments: [.findings[] | select(.inline) | {path, line, side: "RIGHT", body: "**\(.priority)** \(.title)\n\n\(.body)"}]
            }' "$review" > "$payload"
          inline_posted=false
          if [ "$(jq '.comments | length' "$payload")" -gt 0 ]; then
            if gh api --method POST "repos/$REPO/pulls/$PR/reviews" --input "$payload" > /dev/null; then
              inline_posted=true
            else
              echo "::warning::Couldn't post the inline comments, so they're listed in the summary instead."
            fi
          fi

          others=$(jq -r --argjson all "$([ "$inline_posted" = true ] && echo false || echo true)" '
            [.findings[] | select($all or (.inline | not))]
            | map("- **\(.priority)** `\(.path):\(.line)`: \(.title) \(.body)") | join("\n")' "$review")
          case "$(jq -r '.stopped // ""' "$review")" in
            cost) note="Stopped early at the cost limit, so not everything was checked." ;;
            turns) note="Stopped early at the turn limit, so not everything was checked." ;;
            refusal) note="Claude declined to continue part-way, so not everything was checked." ;;
            *) note="" ;;
          esac
          footer=$(jq -r '"\(.model), \(.effort) effort, \(.turns) turn\(if .turns == 1 then "" else "s" end), about US$\(.cost_usd * 100 | round / 100) of API credit"' "$review")

          {
            echo "<!-- claude-review sha=$HEAD_SHA -->"
            echo "**Claude review** of the $scope"
            echo
            jq -r '.summary' "$review"
            if [ -n "$others" ]; then
              echo
              if [ "$inline_posted" = true ]; then echo "Not on a changed line:"; else echo "Findings:"; fi
              echo "$others"
            fi
            if [ -n "$note" ]; then
              echo
              echo "_${note}_"
            fi
            echo
            echo "<sub>${footer}</sub>"
          } > "$RUNNER_TEMP/summary.md"

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@"$RUNNER_TEMP/summary.md" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/summary.md"
          fi
