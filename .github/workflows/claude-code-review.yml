name: Claude Code Review

# Reviews pull requests with Claude Sonnet and posts inline comments plus one
# summary comment. The first run reviews the whole PR. Each later push is
# reviewed from the last reviewed commit, so only new changes are read; after a
# force-push or rebase the whole PR is reviewed again. The summary comment
# (marked <!-- claude-review sha=... -->) records the reviewed commit and is
# updated in place. A newer push cancels a review that's still running. Skips
# drafts, bots, fork PRs (GitHub withholds secrets from them) and
# Markdown-only changes. Uses the CLAUDE_CODE_OAUTH_TOKEN secret (a Claude
# subscription token from `claude setup-token`), or ANTHROPIC_API_KEY when that
# isn't set. Without either, the job does nothing.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      REVIEW_MODEL: claude-sonnet-5-5
    steps:
      - name: Skip without credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Add a CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) repository secret to turn on Claude reviews."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prepare the review
        id: prep
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          dir=.claude-review
          mkdir -p "$dir"

          # The latest summary comment and the commit it reviewed ("-" for the
          # older marker, which didn't record one).
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review"))) | "\(.id) \((.body | capture("sha=(?<s>[0-9a-f]{40})") | .s) // "-")"' \
            > "$RUNNER_TEMP/summaries.txt"
          comment_id=""
          last_sha=""
          if [ -s "$RUNNER_TEMP/summaries.txt" ]; then
            read -r comment_id last_sha < <(tail -n 1 "$RUNNER_TEMP/summaries.txt")
            if [ "$last_sha" = "-" ]; then last_sha=""; fi
          fi
          if [ "$last_sha" = "$HEAD_SHA" ]; then
            echo "::notice::This commit has already been reviewed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only "$merge_base" "$HEAD_SHA" > "$dir/files.txt"
          if [ -n "$last_sha" ] && git merge-base --is-ancestor "$last_sha" "$HEAD_SHA" 2>/dev/null; then
            mode=incremental
            from=$last_sha
          else
            mode=full
            from=$merge_base
          fi

          # Only the PR's own files, without generated Xcode project files, so
          # a merge from main doesn't pull unrelated changes into the review.
          mapfile -t files < <(grep -vE '\.xcodeproj/|\.xcworkspace/' "$dir/files.txt" || true)
          : > "$dir/diff.patch"
          if [ "${#files[@]}" -gt 0 ]; then
            git diff "$from" "$HEAD_SHA" -- "${files[@]}" > "$dir/diff.patch"
          fi
          if [ ! -s "$dir/diff.patch" ]; then
            echo "::notice::Nothing new to review since ${from:0:7}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr view "$PR" --repo "$REPO" --json title,body --jq '"# \(.title)\n\n\(.body)"' > "$dir/pr.md"
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | "- \(.user.login) on \(.path):\(.line // .original_line) (comment \(.id)\(if .in_reply_to_id then ", replying to \(.in_reply_to_id)" else "" end)): \(.body | gsub("<!--[^>]*-->"; "") | split("<details>")[0] | gsub("\\s+"; " ") | .[0:800])"' \
            > "$dir/comments.md"
          if [ ! -s "$dir/comments.md" ]; then echo "No review comments yet." > "$dir/comments.md"; fi

          {
            echo "mode=$mode"
            echo "from=$from"
            echo "comment_id=$comment_id"
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        id: claude
        if: env.HAS_CREDENTIALS == 'true' && steps.prep.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You're reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. Its head commit is checked out in the working directory, with full git history.

            ${{ steps.prep.outputs.mode == 'incremental' && format('You reviewed this PR before, at commit {0}. Review only what has changed since then.', steps.prep.outputs.from) || 'This is the first review of this PR, so review every change it makes.' }}

            These files in .claude-review/ are prepared for you:
            - pr.md: the PR title and description.
            - diff.patch: the changes to review, without generated Xcode project files.
            - files.txt: every file the PR changes.
            - comments.md: review comments already on the PR, from you and from others, with replies.

            How to review:
            1. Read pr.md, then AGENTS.md and CONTRIBUTING.md for the project's rules.
            2. Read diff.patch. Then open every changed source file in full, not just the changed lines. For each changed function, type or property, use Grep to find its callers and read those call sites. Follow the code far enough to know what actually happens at runtime.
            3. Look hard for these kinds of bug:
               - Async races: state read before an `await` and used after it (a copied list being looped over, a flag, a selection) when something else can change it in between.
               - Cancellation: an item cancelled or removed while its request is in flight still completes and acts afterwards, or a retry outlives its cancellation.
               - Account, server or profile switches part-way through: a result started under the old one is written into the new one, or reported as an error there.
               - Error handling: temporary failures (offline, timeouts, 401, 408, 429, 5xx) treated as permanent, or a failed lookup treated as "nothing found" so the code carries on with a wrong default.
               - UI states that miss a case: a button, menu item or message offered or worded wrongly for an item that's waiting, registering, failed, skipped or already downloaded.
               - Data assumptions: missing metadata dropped or defaulted so a label claims something not every item has, unknown values treated as a known value, or a filter applied in one place but not another.
               - Partial data: choices built from what's loaded so far (cached pages, the first season) while the rest is still loading.
               - Documentation that says something the code doesn't do.
               - Also ordinary bugs, crashes, regressions, security problems, private details (keys, tokens, personal names or emails, server addresses, home-folder paths) and clear breaks of the AGENTS.md rules.
            4. Before posting anything, check it again against the code. Trace the real path, confirm the trigger can happen (find a caller that reaches it), and drop the finding if you can't show how it goes wrong. Skip style nitpicks, requests for more tests and anything the compiler would catch. Don't repeat a finding that's already in comments.md, even in different words, and accept a reply explaining why something isn't a problem unless the code clearly shows otherwise.
            5. Post each finding as an inline comment on the changed line with mcp__github_inline_comment__create_inline_comment. Start with its priority: **P1** for a crash, data loss, a security problem or a core feature broken; **P2** for wrong behaviour a user can run into; **P3** for minor issues and documentation. Then say what goes wrong, the situation that triggers it and how to fix it, in two to four sentences.
            6. Your final message is posted for you as the summary comment, so don't post one yourself. Write only the summary: one line on what you reviewed, then the findings as a short list by priority with file names, or one line saying nothing needs fixing. Mention anything you couldn't check.

            Write in Australian English without em dashes.
          claude_args: >-
            --model ${{ env.REVIEW_MODEL }}
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
      - name: Post the summary
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODE: ${{ steps.prep.outputs.mode }}
          FROM: ${{ steps.prep.outputs.from }}
          COMMENT_ID: ${{ steps.prep.outputs.comment_id }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          result=$(jq -c '[.[] | select(.type == "result")] | last // {}' "$EXECUTION_FILE")
          summary=$(jq -r '.result // empty' <<< "$result")
          if [ "$(jq -r '.subtype // empty' <<< "$result")" != "success" ] || [ -z "$summary" ]; then
            echo "::warning::Claude didn't finish the review, so the summary wasn't updated. The next push reviews this range again."
            exit 0
          fi
          turns=$(jq -r '.num_turns // "?"' <<< "$result")
          cost=$(printf '%.2f' "$(jq -r '.total_cost_usd // 0' <<< "$result")")
          if [ "$MODE" = incremental ]; then
            scope="new commits ${FROM:0:7}..${HEAD_SHA:0:7}"
          else
            scope="whole PR at ${HEAD_SHA:0:7}"
          fi
          body=$(printf '<!-- claude-review sha=%s -->\n**Claude review** of the %s\n\n%s\n\n<sub>%s, %s turns, about US$%s at API rates</sub>\n' \
            "$HEAD_SHA" "$scope" "$summary" "$REVIEW_MODEL" "$turns" "$cost")
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body "$body"
          fi
