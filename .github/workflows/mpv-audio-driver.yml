name: Lucid native audio driver

on:
  push:
    branches: [experiment-2.0]
    paths: ['patches/mpv/**', '.github/workflows/mpv-audio-driver.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: Native library to rebuild
        type: choice
        default: both
        options: [both, tvos-device, ios-device]

permissions:
  contents: read

concurrency:
  group: mpv-audio-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        platform: ${{ github.event_name == 'workflow_dispatch' && inputs.platform != 'both' && inputs.platform != '' && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["tvos-device","ios-device"]') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: edde746/mpv-build
          ref: c6f7e635c2c8681fa13c2c678f0e61ae46fe8bc6
          path: native-build
          persist-credentials: false
      - name: Apply Vivid audio restart patch
        run: |
          cp patches/mpv/0001-avfoundation-resume-after-audio-eof.patch native-build/patches/mpv/pool/0901-vivid-audio-eof.patch
          printf '\n0901-vivid-audio-eof.patch\n' >> native-build/patches/mpv/series.apple
      - name: Install build tools
        run: |
          brew install autoconf automake libtool ninja
          python -m pip install meson==1.4.2
      - name: Rebuild libmpv for ${{ matrix.platform }}
        working-directory: native-build
        run: make build use-prebuilt libs=libmpv platform=${{ matrix.platform }}
      - name: Verify restart gate and binary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          sources = list(Path('native-build').glob('**/audio/out/ao_avfoundation.m'))
          assert sources, 'Missing compiled driver source'
          for path in sources:
              subprocess.run(['python3', 'scripts/tests/compressed-audio-recovery-tests.py', str(path)], check=True)
              text = path.read_text()
              start = text[text.index('static void start('):]
              block = start[:start.index('static void stop(')]
              assert block.index('p->avp_eof = false;') < block.index('feed_avp(ao);')
          binaries = list(Path('native-build/dist').glob('**/Libmpv.framework/Libmpv'))
          assert binaries, 'Missing rebuilt libmpv'
          for path in binaries:
              assert b'resuming compressed feed after audio EOF' in path.read_bytes()
          print('Verified compiled EOF restart patch')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mpv-${{ matrix.platform }}-audio-driver
          path: native-build/dist/release/Libmpv*.zip
          if-no-files-found: error
          retention-days: 3
