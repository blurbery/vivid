name: Player regression

on:
  # Every pull request starts this workflow, so "Player regression result",
  # a required check on main, always reports. The changes job decides whether
  # anything needs building: only changes to the paths in the push filter
  # below do, and everything builds when it can't compare against the base
  # commit.
  pull_request:
  # After merge, main runs the iOS suite only with the Release optimiser, plus
  # the unsigned device builds when a project spec or Package.resolved
  # changed or the base commit can't be compared. The normal iOS suite, and
  # the Apple TV suite where relevant, already passed on the pull request.
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'scripts/xcode/**'
      - 'scripts/tests/playback-auth-refresh-tests.py'
      - 'scripts/tests/native-profile-restoration-tests.py'
      - 'scripts/tests/jellyfin-replacement-tests.py'
      - 'scripts/tests/topshelf-native-tests.py'
      - 'scripts/tests/mpv-track-tests.py'
      - 'scripts/ci/check-introdb-client.sh'
      - 'scripts/ci/check-mdblist-sync.sh'
      - 'scripts/ci/check-engine-package-pin.py'
      - 'scripts/ci/check-no-previous-player-code.py'
      - '.github/workflows/player-regression.yml'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional unchanged upstream commit for a comparative full-suite run
        type: string
        required: false
      record_preview:
        description: Also record a synthetic playback clip after a manually requested build
        type: boolean
        default: false
      ios_only:
        description: Skip the Apple TV simulator suite for an iOS-only change (device builds still follow device_builds)
        type: boolean
        default: false
      optimised:
        description: Also run the iOS suite compiled with the Release optimiser
        type: boolean
        default: false
      device_builds:
        description: Also build both apps unsigned for generic devices
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: player-regression-${{ github.event_name }}-${{ github.ref }}-${{ inputs.baseline_ref || 'head' }}
  # Runs on main are not cancelled mid-build: a newer merge queues behind the
  # current run, and only the newest queued run is kept. Pull requests still
  # cancel superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.app.outputs.app }}
      tvos: ${{ steps.filter.outputs.tvos }}
      ios: ${{ steps.matrix.outputs.ios }}
      device_builds: ${{ steps.devices.outputs.device_builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          persist-credentials: false
          fetch-depth: 0
      # One list for the steps below: NUL-separated and unquoted, so unusual
      # file names still match, and --no-renames lists both sides of a move.
      # A failing git diff stops the job. Without a comparable base commit
      # (none recorded, or one sharing no history with the head, for example
      # after a force-push on main) the list is marked unknown and the app,
      # tvOS and device-build steps treat every file as changed; pushes to
      # main still skip Apple TV.
      - name: List changed files
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
              || ! git merge-base "$BASE" "$HEAD" > /dev/null 2>&1; then
            echo "No comparable base commit; treating every file as changed"
            touch "$RUNNER_TEMP/changed-files-unknown"
            : > "$changed"
            exit 0
          fi
          git -c core.quotePath=false diff -z --name-only --no-renames "$BASE...$HEAD" > "$changed"
      - name: Detect app changes
        id: app
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Pull requests build and test only when they change a file the push
          # filter above lists, or when the base commit can't be compared; keep
          # the two lists the same. Pushes to main are already filtered by it,
          # and manual runs always build.
          if [ "$EVENT" != pull_request ] || [ -e "$RUNNER_TEMP/changed-files-unknown" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app=false
          while IFS= read -r -d '' file; do
            case "$file" in
              iosApp/*|scripts/xcode/*|scripts/tests/playback-auth-refresh-tests.py|\
              scripts/tests/native-profile-restoration-tests.py|\
              scripts/tests/jellyfin-replacement-tests.py|scripts/tests/topshelf-native-tests.py|\
              scripts/tests/mpv-track-tests.py|scripts/ci/check-introdb-client.sh|\
              scripts/ci/check-mdblist-sync.sh|scripts/ci/check-engine-package-pin.py|\
              scripts/ci/check-no-previous-player-code.py|.github/workflows/player-regression.yml)
                echo "App change: $file"
                app=true
                break ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - name: Choose iOS builds
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          OPTIMISED: ${{ inputs.optimised }}
        shell: bash
        run: |
          set -euo pipefail
          # Pull requests run the normal Debug suite. Pushes to main run only
          # the Release-optimiser suite, after the pull request has passed.
          # Manual runs add the optimised build when requested.
          normal='{"scheme":"Vivid","destination":"platform=iOS Simulator,name=iPhone 17 Pro","action":"test"}'
          optimised='{"scheme":"Vivid","destination":"platform=iOS Simulator,name=iPhone 17 Pro","action":"test","build":"optimised"}'
          case "$EVENT" in
            push) ios="[$optimised]" ;;
            workflow_dispatch)
              if [ "$OPTIMISED" = true ]; then ios="[$normal,$optimised]"; else ios="[$normal]"; fi ;;
            *) ios="[$normal]" ;;
          esac
          jq -e 'length > 0' <<< "$ios" > /dev/null
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
      - name: Detect tvOS-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Pushes to main skip Apple TV because it passed on the pull request.
          # Manual runs include it unless ios_only is set (the tvos-tests job
          # checks that). Pull requests run it when the base commit can't be
          # compared, or when an app file other than an iOS-only one, a
          # scripts/xcode/ build phase or this workflow changes, so new shared
          # paths are tested by default rather than silently skipped. Docs, the
          # check scripts and other files outside the app don't count.
          if [ "$EVENT" = push ]; then
            echo "tvos=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != pull_request ] || [ -e "$RUNNER_TEMP/changed-files-unknown" ]; then
            echo "tvos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Test files compiled into VividTVTests, read from the tvOS spec so
          # this list cannot drift from the target.
          tv_tests=$(grep -oE 'path: Tests/[^[:space:]]+' iosApp/project.yml | sed 's|^path: |iosApp/|')
          tvos=false
          while IFS= read -r -d '' file; do
            case "$file" in
              iosApp/project-ios.yml|iosApp/DownloadsActivity/*) continue ;;
              iosApp/Vivid.entitlements|iosApp/Vivid.personal.entitlements) continue ;;
              iosApp/Signing/VividTV*.xcconfig) ;;
              iosApp/Signing/*.xcconfig|iosApp/Signing/*.sample) continue ;;
              iosApp/Tests/*)
                grep -qxF "$file" <<< "$tv_tests" || continue ;;
              iosApp/*|scripts/xcode/*|.github/workflows/player-regression.yml) ;;
              *) continue ;;
            esac
            echo "tvOS-relevant: $file"
            tvos=true
            break
          done < "$RUNNER_TEMP/changed-files"
          echo "tvos=$tvos" >> "$GITHUB_OUTPUT"
      - name: Detect project and engine pin changes
        id: devices
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.device_builds }}
        shell: bash
        run: |
          set -euo pipefail
          # Unsigned device builds of both apps run when a project spec or
          # Package.resolved changes (the platform specs and Package.resolved
          # hold the engine pins), or when the base commit can't be compared.
          # Manual runs build them only when asked.
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REQUESTED" = true ]; then device_builds=true; else device_builds=false; fi
            echo "device_builds=$device_builds" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -e "$RUNNER_TEMP/changed-files-unknown" ]; then
            echo "device_builds=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          device_builds=false
          while IFS= read -r -d '' file; do
            case "$file" in
              iosApp/project.yml|iosApp/project-ios.yml|iosApp/project-common.yml|iosApp/*Package.resolved)
                echo "Device build trigger: $file"
                device_builds=true
                break ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "device_builds=$device_builds" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The changes job chooses the normal and/or optimised iOS entries for
        # this event. Apple TV runs its own test job below, gated on
        # tvOS-relevant changes.
        include: ${{ fromJSON(needs.changes.outputs.ios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.baseline_ref || github.sha }}
      - name: Verify the Lucid Engine package pin
        if: ${{ !inputs.baseline_ref }}
        run: python3 scripts/ci/check-engine-package-pin.py
      - name: Check that no previous third-party player code or package returns
        if: ${{ !inputs.baseline_ref }}
        run: python3 scripts/ci/check-no-previous-player-code.py
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Verify Jellyfin replacement ordering
        if: matrix.action == 'test'
        run: python3 scripts/tests/jellyfin-replacement-tests.py
      - name: Verify native Emby and Jellyfin Top Shelf
        if: matrix.action == 'test'
        run: python3 scripts/tests/topshelf-native-tests.py
      - name: Verify native Apple TV account restoration
        if: matrix.action == 'test'
        run: python3 scripts/tests/native-profile-restoration-tests.py
      - name: Verify the adapter's track ID translation and teardown
        if: matrix.action == 'test'
        run: python3 scripts/tests/mpv-track-tests.py
      - name: Verify playback survives credential refresh
        if: matrix.action == 'test'
        run: |
          python3 scripts/tests/playback-auth-refresh-tests.py
          bash scripts/ci/check-introdb-client.sh
          bash scripts/ci/check-mdblist-sync.sh
      - name: Prepare iOS simulator
        if: matrix.action == 'test'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Hosted images do not always have a usable pre-created device.
          # Match the selected Xcode SDK and reuse one explicit destination.
          runtime_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          find_runtime() {
            xcrun simctl list runtimes --json | jq -r --arg version "$runtime_version" \
              '[.runtimes[] | select(.isAvailable and .version == $version and
                (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))][0].identifier // empty'
          }
          runtime_id=$(find_runtime)
          if [ -z "$runtime_id" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$runtime_version"
            runtime_id=$(find_runtime)
          fi
          if [ -z "$runtime_id" ]; then
            echo "::error::No available iOS $runtime_version simulator runtime"
            exit 1
          fi
          simulator_id=$(xcrun simctl create Vivid-Player-Regression \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime_id")
          echo "VIVID_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "VIVID_TEST_DESTINATION=platform=iOS Simulator,id=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          # Pin the official 2.43.0 release asset before unpacking/executing it.
          echo "a4847ed77d3341a4d24049bc4424a3babca4c94ff1dcaaee923eaca2b32c678f  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          /tmp/xcodegen-dist/xcodegen/bin/xcodegen generate --spec iosApp/project-ios.yml
      - name: Build player
        id: build
        env:
          BUILD: ${{ matrix.build }}
        run: |
          set -o pipefail
          # The optimised entry compiles the same Debug test build with the
          # Release optimiser, so bugs that only appear in TestFlight and App
          # Store builds fail here. Debug keeps the test-only hooks available.
          optimisation=()
          if [ "$BUILD" = optimised ]; then
            optimisation=(SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule)
          fi
          # Simulator-only ad-hoc signing supplies the application identifier
          # required by Keychain. No certificate or release secret is used.
          xcodebuild build-for-testing -project iosApp/Vivid.xcodeproj -scheme Vivid \
            -destination "$VIVID_TEST_DESTINATION" -derivedDataPath /tmp/vivid-derived \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- "${optimisation[@]}" | tee /tmp/player-build.log
      - name: Package simulator tests for focused visual verification
        if: matrix.action == 'test' && matrix.build != 'optimised' && !inputs.baseline_ref
        run: ditto -c -k --keepParent /tmp/vivid-derived/Build/Products /tmp/Vivid-simulator-tests.zip
      - name: Upload compiled simulator tests
        if: matrix.action == 'test' && matrix.build != 'optimised' && !inputs.baseline_ref
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vivid-simulator-tests
          path: /tmp/Vivid-simulator-tests.zip
          retention-days: 3
      - name: Run complete iOS suite
        if: matrix.action == 'test'
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild test-without-building -project iosApp/Vivid.xcodeproj -scheme Vivid \
            -destination "$VIVID_TEST_DESTINATION" -derivedDataPath /tmp/vivid-derived \
            -only-testing:VividTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath /tmp/player-validation.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee /tmp/player-validation.log
      - name: Record synthetic preview expansion and successor playback
        if: matrix.action == 'test' && matrix.build != 'optimised' && !inputs.baseline_ref && steps.build.outcome == 'success' && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.record_preview)
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the compiled test bundle. This records only the bounded
          # synthetic-video test, not a second build or the full test suite.
          # XCTest can shut down the simulator after the full suite. Boot the
          # exact recording destination before starting the recorder.
          simulator_id="$VIVID_SIMULATOR_ID"
          simulator_state=$(xcrun simctl list devices available --json | jq -r \
            --arg id "$simulator_id" '.devices[][] | select(.udid == $id) | .state')
          if [ "$simulator_state" != Booted ]; then
            xcrun simctl boot "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl io "$simulator_id" recordVideo /tmp/preview-transition.mp4 &
          recorder_pid=$!
          trap 'kill -INT "$recorder_pid" 2>/dev/null || true; wait "$recorder_pid" || true' EXIT
          xcodebuild test-without-building -project iosApp/Vivid.xcodeproj -scheme Vivid \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath /tmp/vivid-derived \
            -parallel-testing-enabled NO \
            -destination-timeout 60 \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -only-testing:VividTests/PlayerSurfaceLayoutTests/testPlayingPreviewExpandsWithoutReplacingItemOrLosingItsLayer \
            -resultBundlePath /tmp/preview-recording.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
          kill -INT "$recorder_pid"
          wait "$recorder_pid"
          trap - EXIT
          test -s /tmp/preview-transition.mp4
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-validation-${{ matrix.scheme }}${{ matrix.build == 'optimised' && '-optimised' || '' }}
          path: |
            /tmp/player-build.log
            /tmp/player-validation.log
            /tmp/player-validation.xcresult
            /tmp/preview-transition.mp4
            /tmp/preview-recording.xcresult
          retention-days: 7

  device-builds:
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.device_builds == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: Vivid
            spec: project-ios.yml
          - platform: tvOS
            scheme: VividTV
            spec: project.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.baseline_ref || github.sha }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Generate Xcode project
        env:
          SPEC: ${{ matrix.spec }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          # Pin the official 2.43.0 release asset before unpacking/executing it.
          echo "a4847ed77d3341a4d24049bc4424a3babca4c94ff1dcaaee923eaca2b32c678f  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          /tmp/xcodegen-dist/xcodegen/bin/xcodegen generate --spec "iosApp/$SPEC"
      - name: Build unsigned for generic ${{ matrix.platform }} devices
        env:
          SCHEME: ${{ matrix.scheme }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          # The Release configuration that ships, for real hardware rather
          # than the simulator. It also proves the Debug-only test hooks
          # compile out. No certificate or release secret is used.
          xcodebuild build -project iosApp/Vivid.xcodeproj -scheme "$SCHEME" \
            -configuration Release -destination "generic/platform=$PLATFORM" \
            -derivedDataPath /tmp/vivid-device CODE_SIGNING_ALLOWED=NO | tee /tmp/device-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-build-${{ matrix.scheme }}
          path: /tmp/device-build.log
          retention-days: 7

  tvos-tests:
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.tvos == 'true' && !inputs.ios_only
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.baseline_ref || github.sha }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Prepare tvOS simulator
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Same approach as the iOS job: match the selected Xcode SDK and
          # create one explicit Apple TV destination.
          runtime_version=$(xcrun --sdk appletvsimulator --show-sdk-version)
          find_runtime() {
            xcrun simctl list runtimes --json | jq -r --arg version "$runtime_version" \
              '[.runtimes[] | select(.isAvailable and .version == $version and
                (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.tvOS-")))][0].identifier // empty'
          }
          runtime_id=$(find_runtime)
          if [ -z "$runtime_id" ]; then
            xcodebuild -downloadPlatform tvOS -buildVersion "$runtime_version"
            runtime_id=$(find_runtime)
          fi
          if [ -z "$runtime_id" ]; then
            echo "::error::No available tvOS $runtime_version simulator runtime"
            exit 1
          fi
          simulator_id=$(xcrun simctl create Vivid-TV-Regression \
            com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K "$runtime_id")
          echo "VIVID_TEST_DESTINATION=platform=tvOS Simulator,id=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          # Pin the official 2.43.0 release asset before unpacking/executing it.
          echo "a4847ed77d3341a4d24049bc4424a3babca4c94ff1dcaaee923eaca2b32c678f  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          /tmp/xcodegen-dist/xcodegen/bin/xcodegen generate --spec iosApp/project.yml
      - name: Build Apple TV player and tests
        run: |
          set -o pipefail
          # Simulator-only ad-hoc signing, as in the iOS job. No certificate or
          # release secret is used.
          xcodebuild build-for-testing -project iosApp/Vivid.xcodeproj -scheme VividTV \
            -destination "$VIVID_TEST_DESTINATION" -derivedDataPath /tmp/vivid-derived \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee /tmp/player-build.log
      - name: Run tvOS suite
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild test-without-building -project iosApp/Vivid.xcodeproj -scheme VividTV \
            -destination "$VIVID_TEST_DESTINATION" -derivedDataPath /tmp/vivid-derived \
            -only-testing:VividTVTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -resultBundlePath /tmp/player-validation.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee /tmp/player-validation.log
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-validation-VividTV
          path: |
            /tmp/player-build.log
            /tmp/player-validation.log
            /tmp/player-validation.xcresult
          retention-days: 7

  # The one job branch protection requires from this workflow. It always runs
  # and fails when any job above failed or was cancelled; a job skipped
  # because nothing it covers changed counts as passed.
  result:
    name: Player regression result
    if: always()
    needs: [changes, validate, device-builds, tvos-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail when any job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A player regression job failed or was cancelled. See the jobs above."
            exit 1
          fi
