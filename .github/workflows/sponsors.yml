name: Sponsors image

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sponsors/**
      - .github/workflows/sponsors.yml

permissions:
  contents: read

concurrency:
  group: vivid-sponsors
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'blurbery/vivid'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - name: Render the sponsors image
        id: render
        env:
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: |
          if [ -z "$SPONSORS_TOKEN" ]; then
            echo "::warning::Add a SPONSORS_TOKEN secret (a classic token with read:user and read:org; fine-grained tokens cannot read sponsor tiers) to update the sponsors image."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/sponsors/render-sponsors.mjs --out "$RUNNER_TEMP/sponsors.svg"
      - name: Publish to the sponsors branch
        if: steps.render.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: blurbery
          GIT_AUTHOR_EMAIL: ${{ vars.VIVID_GIT_NOREPLY_EMAIL }}
          GIT_COMMITTER_NAME: blurbery
          GIT_COMMITTER_EMAIL: ${{ vars.VIVID_GIT_NOREPLY_EMAIL }}
        run: |
          case "$GIT_AUTHOR_EMAIL" in
            *@users.noreply.github.com) ;;
            *) echo "Configure VIVID_GIT_NOREPLY_EMAIL before publishing."; exit 1 ;;
          esac
          mkdir "$RUNNER_TEMP/publish" && cd "$RUNNER_TEMP/publish"
          git init -q -b sponsors
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # ls-remote exits 2 when the branch doesn't exist yet; any other failure stops the run.
          status=0
          git ls-remote --exit-code --heads origin sponsors >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch -q --depth 1 origin sponsors
            git checkout -q -B sponsors FETCH_HEAD
          elif [ "$status" -ne 2 ]; then
            echo "Couldn't check for the sponsors branch."
            exit 1
          fi
          cp "$RUNNER_TEMP/sponsors.svg" sponsors.svg
          printf '%s\n' "Generated by the Sponsors image workflow on main. The README shows sponsors.svg; don't edit this branch by hand." > README.md
          git add sponsors.svg README.md
          if git diff --cached --quiet; then
            echo "Sponsors image unchanged."
            exit 0
          fi
          git commit -q -m "chore: update the sponsors image [skip release]"
          git push -q origin sponsors
      - name: Refresh the jsDelivr copy
        if: steps.render.outputs.skip != 'true'
        # The README's click-through link opens the image on jsDelivr, which caches branches for
        # up to 12 hours. A purge straight after the push can refetch the old file, so compare
        # jsDelivr's copy with the new image and purge again until they match. This also runs
        # when the image didn't change, so it repairs a copy an earlier run left behind.
        run: |
          url="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@sponsors/sponsors.svg"
          purge="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@sponsors/sponsors.svg"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "$url" -o "$RUNNER_TEMP/jsdelivr.svg" \
              && cmp -s "$RUNNER_TEMP/jsdelivr.svg" "$RUNNER_TEMP/sponsors.svg"; then
              echo "jsDelivr serves the current image."
              exit 0
            fi
            sleep 20
            curl -fsS --max-time 30 "$purge" >/dev/null || true
            sleep 10
          done
          echo "::warning::jsDelivr still serves an older sponsors.svg; it refreshes on its own within 12 hours."
