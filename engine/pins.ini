# Lucid Engine pins: every input the build downloads, with its exact URL,
# version or commit, and SHA-256. `lucid.py fetch` refuses a file whose hash
# differs, and `lucid.py check-allowlist` refuses a host or project that is
# not on its allowlist. Details: docs/cores/lucid-engine-build.md.
#
#   [toolchain]    what the CI build expects from the runner
#   [tool:*]       build tools downloaded for the build
#   [source:*]     upstream sources built from source here, plus their
#                  patch series under engine/patches/<name>/series
#   [prebuilt:*]   interim third-party binaries for libraries not yet built
#                  from source here. `url` is the build input (headers,
#                  thin static libraries and pkg-config files for every
#                  slice); `xcframework_url` is the matching SwiftPM binary
#                  that a package can use until the library is rebuilt.
#
# `commit` for a source archive is the commit id GitHub embeds in the
# archive, which `lucid.py fetch` reads back and compares.

[toolchain]
xcode = 26.6
minimum_os = 14.0
# Vivid's own deployment targets, used for the test link in `lucid.py check`.
app_minimum_ios = 18.0
app_minimum_tvos = 26.0

