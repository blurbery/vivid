# Lucid Engine pins: every input the build downloads, with its exact URL,
# version or commit, and SHA-256. `lucid.py fetch` refuses a file whose hash
# differs, and `lucid.py check-allowlist` refuses a host or project that is
# not on its allowlist. Details: docs/cores/lucid-engine-build.md.
#
#   [toolchain]    what the CI build expects from the runner
#   [tool:*]       build tools downloaded for the build
#   [rust:*]       the Rust toolchain for libdovi: rustc, cargo and the
#                  standard library for the host and each slice's target
#   [source:*]     upstream sources of every library the engine links, all
#                  built here, plus their patch series under
#                  engine/patches/<name>/series
#   [part:*]       further upstream archives a source tree is assembled
#                  from (submodules and fetched externals), named by the
#                  `parts` of the [source:*] sections that use them
#
# `commit` for a source or part archive is the commit id GitHub embeds in
# the archive, which `lucid.py fetch` reads back and compares. A project's
# own release tarball (`release_tarball = yes`) embeds none.

[toolchain]
xcode = 26.6
minimum_os = 14.0
# Vivid's own deployment targets, used for the test link in `lucid.py check`.
app_minimum_ios = 18.0
app_minimum_tvos = 26.0
# SOURCE_DATE_EPOCH for every build, so binaries that record a build date
# (mpv's) are reproducible: 2025-12-21 19:08:20 UTC, mpv v0.41.0's commit.
source_date_epoch = 1766344100

