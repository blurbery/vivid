# CodeRabbit review settings for Vivid.
# Schema: https://coderabbit.ai/integrations/schema.v2.json
#
# Vivid is public, so it uses CodeRabbit's free open-source plan. That plan's
# PR review limit depends on the repository's star count, and Vivid gets one
# review an hour. Every review, including one asked for in a comment, uses it,
# and a PR that is rate limited is not reviewed later on its own. So CodeRabbit
# reviews each ready PR once, automatically, including docs PRs, and skips
# drafts, bot PRs and large generated or vendored files. Batch fixes into one push and comment
# `@coderabbitai review` when you want it to look again, and comment
# `@coderabbitai rate limit` to see when the next review is free.
#
# CodeRabbit only comments. It never edits PR descriptions, pushes commits,
# approves or requests changes, so PR checks and commit attribution stay as
# they are. Treat its findings like any other review: check them against the
# source before changing anything.
language: en-AU
tone_instructions: >-
  Concise Australian English, no em dashes. Prioritise real bugs: state,
  concurrency, cancellation, error paths, cross-file consistency, security,
  privacy. Explain the failure scenario. Never propose design changes.
early_access: false
enable_free_tier: true

reviews:
  # Assertive finds more real issues. Pure style points are collapsed as
  # nitpicks, and the tone above keeps them to a minimum.
  profile: assertive
  request_changes_workflow: false
  # Keep the summary in CodeRabbit's own comment. PR checks parse the
  # description, so CodeRabbit must not write into it.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  abort_on_close: true
  auto_approvals:
    enabled: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    # Only the first review is automatic. Follow-up pushes are reviewed when
    # someone comments `@coderabbitai review`, so fix-up pushes don't use the
    # hour's review or crowd out a newly opened PR.
    auto_incremental_review: false
    # Docs PRs are reviewed too: the Docs job checks links, paths, em dashes
    # and that mapped docs change with their code, not whether the text is
    # right. Keywords match anywhere in the title, ignoring case, so they are
    # kept specific: a bare "wip" would also skip "fix: wipe downloads". Add
    # "[skip review]" to a title to skip it, then comment `@coderabbitai review`
    # if you change your mind.
    ignore_title_keywords:
      - "[skip review]"
      - "[WIP]"
      - "WIP:"
    ignore_usernames:
      - "dependabot[bot]"
  # Every commit on main must be attributed to blurbery, so CodeRabbit must not
  # push fixes, tests or docstrings to PR branches.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  # The repository's own PR checks already enforce the title and description.
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "Design approval"
        mode: warning
        instructions: >-
          Pass when the PR makes no visual or interaction design change
          (layout, navigation, focus behaviour, colours, typography, spacing,
          icons, artwork, animation or transitions), or when its "Design
          impact and approval" section references blurbery's approval for the
          change. Fail when the diff changes design and that section says
          "No design changes" or gives no approval.
      - name: "Private details"
        mode: warning
        instructions: >-
          Fail when the diff or PR description adds personal or account
          details: a real name or personal email (anything other than a
          users.noreply.github.com address), home-folder paths such as
          /Users/<name>, IP addresses, server hostnames, device or room
          names, media server usernames, library or account IDs, API keys,
          tokens or passwords. Placeholders such as example.com,
          user@example.com and <account-id> are fine. Pass otherwise.
      - name: "Docs up to date"
        mode: warning
        instructions: >-
          Every PR must keep Vivid's docs up to date. For each behaviour,
          setting, default, limit, file path, workflow or process the diff
          changes, search README.md, CONTRIBUTING.md, AGENTS.md, everything
          under docs/, website/public/privacy.html and the in-app privacy
          text for statements about it, including files the PR does not
          touch. Fail when any of them still describes the old behaviour or
          now contradicts the code or another doc, naming each file and line
          and what it should say. Also fail when the PR changes dependencies
          without updating THIRD_PARTY_NOTICES.md and the in-app licences, or
          changes what the app sends or stores without updating the privacy
          policy. Pass otherwise, including when the PR's "Documentation
          impact" section explains why no doc needed changing and that
          reason holds.
  path_filters:
    # Large generated or vendored files that would use up review capacity.
    # The String Catalogs hold real translations, but at over 2 MB they are
    # too big to review usefully, so CodeRabbit doesn't check translations.
    - "!**/*.xcstrings"
    - "!**/package-lock.json"
    - "!engine/config/expected-libs/**"
    - "!iosApp/Tests/Fixtures/**"
    - "!diagnostics-relay/fixtures/**"
    - "!website/public/fonts/**"
  path_instructions:
    - path: "**"
      instructions: >-
        Review like a careful senior engineer hunting for bugs, not style.
        Trace each change through its callers and callees, including files
        this PR does not touch, and report concrete failures: wrong results,
        crashes, state that gets stuck or lost, races, missing cancellation or
        cleanup, unhandled errors and edge cases (empty, nil, zero, very large,
        offline, slow or refused responses), and security or privacy leaks.
        For each finding, describe the inputs or sequence that trigger it and
        what the user sees, and how confident you are. Check that a fix
        actually covers every path to the bug, and that tests added for it
        would fail without the fix. Treat the docs as part of the code. When
        this file changes how
        something behaves, search README.md, CONTRIBUTING.md, AGENTS.md and
        docs/ for descriptions of it, even in files this PR does not touch,
        and flag any that are now wrong or incomplete, quoting the stale
        line and what it should say. Numbers matter: check defaults, limits,
        step sizes, timeouts and counts in the docs against the code.
    - path: "iosApp/**/*.swift"
      instructions: >-
        Vivid's design (layout, navigation, focus behaviour, colours,
        typography, spacing, icons, artwork and animation) is controlled by
        blurbery. Do not suggest design changes. If the PR changes design
        without referencing blurbery's approval, point that out instead.
        Bug fixes must preserve the approved design. Look hardest at state
        that can get stuck or lost: async work that outlives its view or
        player, missing cancellation, main-actor and threading mistakes,
        retain cycles, rollback after a failed server or profile switch, and
        behaviour that differs between iOS and tvOS. For tvOS focus code,
        follow docs/apple-tv-focus.md: prefer a stable native focus graph or
        a single composite focus owner. Keep each server core (Silo, Emby,
        Jellyfin) separate and flag changes that alter another provider's
        authentication, endpoints or playback reporting. Interface text
        belongs in the String Catalogs (docs/localisation.md). Do not ask for
        tests on small or UI-only changes.
    - path: "iosApp/iosApp/Networking/**"
      instructions: >-
        Check that auth tokens and API keys never reach logs, diagnostics,
        URLs shown to the user or other servers. Check size and time limits
        are enforced while data streams in, not after it is fully buffered,
        and that a refused or failed optional request never signs the user
        out. Compare with the same path in the other providers.
    - path: "iosApp/iosApp/Playback/MPV/**"
      instructions: >-
        This is the Lucid Engine adapter. Check it against
        docs/cores/lucid-engine-architecture.md, and watch for teardown,
        threading and track ID mistakes.
    - path: "iosApp/Tests/**"
      instructions: >-
        iOS tests come from the whole folder, but the tvOS test target
        (VividTVTests in iosApp/project.yml) lists its files one by one.
        Flag a new test file for shared code that is missing from that list.
        Check that each test really exercises the behaviour it names rather
        than passing trivially, that its assertions would fail if the code
        regressed, and that test doubles behave like the real server or
        component. Flag behaviour changes in shared logic that have no test
        when the risk is high (sign-in, playback, sync, data loss).
    - path: "{diagnostics-relay,tmdb-relay,website}/**/*.{mjs,js,jsonc}"
      instructions: >-
        These are Cloudflare Workers. Check them against
        docs/diagnostics-relay.md and docs/tmdb-relay.md.
        Watch for unvalidated input, missing size or rate limits, secrets or
        personal data in logs or responses, CORS and caching mistakes, and
        error responses that leak internals. Check the worker tests cover
        the changed paths.
    - path: "scripts/**"
      instructions: >-
        CI, release and tooling scripts. Check that they fail loudly rather
        than passing on bad input, quote shell variables, handle missing
        files and network errors, and still match how
        docs/release/versioning.md and CONTRIBUTING.md describe them.
    - path: "iosApp/project*.yml"
      instructions: >-
        These XcodeGen specs generate the Xcode project. Bundle IDs, keychain
        groups, signing and entitlements must not change unless the PR says
        why. The engine package pin must match Package.resolved.
    - path: "engine/**"
      instructions: >-
        Check engine changes against docs/cores/lucid-engine-build.md and
        docs/playback/lucid-engine-patch-spec.md.
    - path: ".github/workflows/**"
      instructions: >-
        Every action and reusable workflow (except local ./ actions and
        docker:// images) must be pinned to a full commit SHA with its version
        in a trailing comment. Watch for secrets exposed to pull requests from
        forks and for untrusted input used in run steps. The Validation
        section of docs/release/versioning.md must describe the change.
    - path: "**/*.md"
      instructions: >-
        Docs use Australian English, no em dashes, and one sentence per line.
        Check every factual claim (behaviour, defaults, limits, numbers, file
        paths, commands, workflow and job names) against the code in the
        repository, not only the files in this PR, and flag anything that is
        wrong, out of date or contradicts another doc, quoting both sides.
        Do not suggest reflowing sentences onto one line.
  tools:
    # No SwiftLint config in the repository, so its default rules would only
    # add noise. markdownlint and LanguageTool would flag the README's HTML
    # layout and Australian spelling.
    swiftlint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    zizmor:
      enabled: true
    ruff:
      enabled: true

chat:
  art: false
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/apple-tv-focus.md"
      - "docs/localisation.md"
  # Learnings come from replies on Vivid PRs. Keep them to this repository.
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local

issue_enrichment:
  auto_enrich:
    enabled: false
