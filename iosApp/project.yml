include: project-common.yml

packages:
  CollectionHStack:
    url: https://github.com/LePips/CollectionHStack
    revision: 15baaaa759a0e252addae08431c79a49a25e4afc
  # Lucid Engine 0.1.0: the commit of tag v0.1.0 of Vivid's own package,
  # every library built from upstream source by Vivid's pipeline in engine/.
  # Its README and NOTICE list what the release contains.
  LucidEngine:
    url: https://github.com/blurbery/lucid-engine
    revision: 53ebeac793f251df987a8d80b997e7fe8064d1b7

targets:
  VividTV:
    templates: [ShippableProduct]
    type: application
    platform: tvOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.xcodeproj"
          - "**/*.xcworkspace"
          - "Info.plist"

      - path: Resources
        buildPhase: resources
    # PRODUCT_BUNDLE_IDENTIFIER and CODE_SIGN_ENTITLEMENTS live in
    # Signing/VividTV.xcconfig so local contributors can override
    # them via Signing/Local.xcconfig without dirtying this file.
    # Target-level `settings` entries win over xcconfig, so they MUST
    # NOT be set below.
    configFiles:
      Debug: Signing/VividTV.xcconfig
      Release: Signing/VividTV.xcconfig
    settings:
      base:
        PRODUCT_NAME: VividTV
        # AVKit supplies UIWindow.avDisplayManager as an Objective-C category.
        # Keep the framework loaded even when no AVKit class is instantiated.
        OTHER_LDFLAGS: "$(inherited) -Wl,-needed_framework,AVKit"
        INFOPLIST_FILE: iosApp/tvOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: TVAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG VIVID_P8_TRIAL"
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    # Records the source commit as VividSourceRevision for About and Open
    # Source Licences. The processed Info.plist is declared as its input so
    # the build system runs it after Info.plist processing, before signing.
    postBuildScripts:
      - name: Stamp source revision
        script: '"$SRCROOT/../scripts/xcode/stamp-source-revision.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(DERIVED_FILE_DIR)/source-revision-stamp
        basedOnDependencyAnalysis: false
    dependencies:
      - package: LucidEngine
        product: LucidEngine
      - package: CollectionHStack
        product: CollectionHStack
      - target: VividTVTopShelf
        embed: true

  # Top Shelf extension: populates the Apple TV Home Screen with
  # Continue Watching / Next Up rows when the Vivid app icon is
  # focused. Shares auth state with the host app via an App Group +
  # shared Keychain access group. Compiles `iosApp/Shared/` for the
  # SharedStorage helpers used on both sides.
  VividTVTopShelf:
    templates: [ShippableProduct]
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: iosApp/Shared
        excludes:
          - "Diagnostics/**"
          - "VividCloudPreferences.swift"
    # PRODUCT_BUNDLE_IDENTIFIER and CODE_SIGN_ENTITLEMENTS live in
    # Signing/VividTVTopShelf.xcconfig so local contributors can
    # override them via Signing/Local.xcconfig without dirtying this
    # file. Target-level `settings` entries win over xcconfig, so they
    # MUST NOT be set below.
    configFiles:
      Debug: Signing/VividTVTopShelf.xcconfig
      Release: Signing/VividTVTopShelf.xcconfig
    settings:
      base:
        PRODUCT_NAME: VividTVTopShelf
        INFOPLIST_FILE: TopShelf/Info.plist
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
    dependencies:
      - sdk: TVServices.framework


  VividTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests/ImageDataCoalescingTests.swift
      - path: Tests/VividPlaybackStatsProjectionTests.swift
      - path: Tests/VividSubtitleCueCursorTests.swift
      - path: Tests/TVDetailScrollMaterialMaskTests.swift
      - path: Tests/TVCatalogGridIndexTests.swift
      # Vivid's player bridge, tested on Apple TV as well as iOS.
      - path: Tests/VividPlayerConversionTests.swift
      - path: Tests/VividPlayerCoreTests.swift
      - path: Tests/VividPlayerDisplayCriteriaTests.swift
      - path: Tests/VividPlayerEngineTests.swift
      # Volume Boost and Enhanced Dialogue measured through Lucid's own mpv and FFmpeg.
      - path: Tests/LucidAudioEnhancementTests.swift
      # Playback-end recovery, Next Up guards and end-of-stream confirmation.
      - path: Tests/PlaybackEndRecoveryTests.swift
      - path: Tests/VividEndOfStreamConfirmationTests.swift
      - path: Tests/PlayerStreamBadgesTests.swift
      # Emby and Jellyfin PlaybackInfo device limits, including Apple TV HD.
      - path: Tests/ServerDeviceProfileTests.swift
      - path: Tests/Fixtures/v3_h264_aac.mp4
        buildPhase: resources
    dependencies:
      - target: VividTV
    configFiles:
      Debug: Signing/VividTV.xcconfig
      Release: Signing/VividTV.xcconfig
    settings:
      base:
        PRODUCT_NAME: VividTVTests
        PRODUCT_BUNDLE_IDENTIFIER: com.blurbery.vivid.tvtest.PerformanceTests
        CODE_SIGN_ENTITLEMENTS: ""
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VividTV.app/VividTV"

schemes:
  VividTV:
    build:
      targets:
        VividTV: all
        VividTVTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VividTVTests
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release
